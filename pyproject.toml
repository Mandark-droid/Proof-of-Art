[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pramaan-proof-of-art"
version = "0.3.0"
description = "Proof-carrying, craft-inspired geometric art and an OpenEnv environment"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "numpy==2.3.5",
  "Pillow==12.3.0",
  "pydantic==2.12.5",
  "openai==2.54.0",
  "python-dotenv==1.2.2",
  "gradio[oauth]==6.31.0",
  "openenv==0.11.0",
  "fastapi",
  "uvicorn",
  "huggingface_hub",
  "anthropic==1.15.0",
  "litellm==1.106.6",
]

[project.scripts]
server = "pramaan_env.server.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pramaan*", "pramaan_env*", "server*"]
exclude = ["tests*", "benchmarks*", "scripts*"]


[dependency-groups]
dev = ["pytest==9.2.0"]
