name: Keep Pramaan Space awake

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake health and Studio routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://kshitijthakkar-pramaan-proof-of-art.hf.space"
          for path in /health /studio/; do
            curl --fail --silent --show-error --location --max-time 90 \
              --retry 2 --retry-delay 5 --retry-all-errors \
              --output /dev/null --write-out "${path} %{http_code}\n" \
              "${base}${path}"
          done
