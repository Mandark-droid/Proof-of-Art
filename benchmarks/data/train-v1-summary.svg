<line x1="622.0" y1="92" x2="622.0" y2="330" stroke="#d7d7d2" stroke-width="1"/>
<text x="622.0" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#50545a">60%</text>
