<line x1="870.0" y1="92" x2="870.0" y2="330" stroke="#d7d7d2" stroke-width="1"/>
<text x="870.0" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#50545a">100%</text>
<text x="42" y="131" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#202124">Overall</text>
<rect x="250" y="116" width="137.8" height="16" rx="3" fill="#315A83"/>
